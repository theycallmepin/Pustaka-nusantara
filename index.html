<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pustaka Nusantara</title><style>
html,body{margin:0;height:100%;background:#E7D8B9}body{height:100dvh;display:flex;flex-direction:column;font-family:Georgia,serif;color:#4A2F1E}
.top{padding:12px 16px;display:flex;gap:8px}.pill{background:#4A2F1E;color:#E7D8B9;padding:5px 14px;border-radius:20px;font:700 11px sans-serif}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.title{font-size:42px;font-weight:900;line-height:1}
.btns{margin-top:18px;display:flex;gap:10px}.btn{background:#5C3A24;color:#E7D8B9;border:2px solid #3D2412;border-bottom:3px solid #3D2412;padding:8px 18px;border-radius:8px;font:700 12px sans-serif}
.bottom{padding:16px;text-align:center;font:700 12px sans-serif;color:#4A2F1E;background:#E7D8B9;position:sticky;bottom:0}
#shop{display:none;flex:1;overflow:auto}
</style></head><body>
<div class="top"><div class="pill">Rp <span id="rp">0</span>k</div><div class="pill">Hari <span id="hr">1</span></div></div>
<div class="center" id="home"><div class="title">Pustaka<br>Nusantara</div><div class="btns"><button class="btn" onclick="document.getElementById('home').innerHTML='<p style=font:700 14px sans-serif>Game lagi dimuat...<br>tap Home buat balik</p><button class=btn onclick=location.reload()>Home</button>'">Mulai</button><button class="btn" style="background:#8B6A4A">Koleksi</button></div></div>
<div id="shop"></div>
<div class="bottom">Toko buku mungil bernuansa kayu perpustakaan Indonesia</div>
</body></html>
