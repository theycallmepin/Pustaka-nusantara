<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pustaka Nusantara</title><style>
html,body{margin:0;background:#E7D8B9;height:100dvh;display:flex;flex-direction:column;color:#4A2F1E;font-family:Georgia,serif;overflow:hidden}
.top{padding:14px 16px;display:flex;gap:8px}.pill{background:#4A2F1E;color:#E7D8B9;padding:5px 14px;border-radius:20px;font:700 11px sans-serif}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.judul{font-size:40px;font-weight:900;line-height:.95}
.btns{margin-top:18px;display:flex;gap:10px}.btn{background:#5C3A24;color:#E7D8B9;border:2px solid #3D2412;border-bottom:3px solid #3D2412;padding:8px 20px;border-radius:8px;font:700 12px sans-serif}
.tulis{margin-top:26px;font:700 11px sans-serif;color:#5C3A24;animation:nafas 3s ease-in-out infinite}
@keyframes nafas{0%,100%{opacity:0;transform:translateY(5px)}50%{opacity:1;transform:translateY(0)}}
.credit{padding:10px 10px calc(12px + env(safe-area-inset-bottom));text-align:center;font:600 9.5px sans-serif;color:#8B7355;letter-spacing:.3px}
</style></head><body>
<div class="top"><div class="pill">Rp 0k</div><div class="pill">Hari 1</div></div>
<div class="mid">
<div class="judul">Pustaka<br>Nusantara</div>
<div class="btns"><button class="btn">Mulai</button><button class="btn" style="background:#8B6A4A">Koleksi</button></div>
<div class="tulis">Toko buku mungil bernuansa kayu perpustakaan Indonesia</div>
</div>
<div class="credit">by Fitri Qur'an</div>
</body></html>
