.chip{background:var(--w1);color:var(--cr);padding:12px 32px;border-radius:40px;border:5px solid #3a2210}
#rack{position:absolute;left:320px;right:320px;bottom:90px;height:240px;background:linear-gradient(var(--w2),var(--w1));border:10px solid #3a2210;border-radius:14px;display:flex;align-items:flex-end;justify-content:center;gap:20px;padding:0 20px 18px}

.bk i{display:block;font-size:15px;font-weight:400;margin-top:6px;background:rgba(0,0,0,.3);border-radius:20px;padding:3px}
.bk.hl{animation:bn .7s infinite alternate}@keyframes bn{to{transform:translateY(-14px)}}
#cu{position:absolute;bottom:360px;left:-300px;width:220px;height:260px;transition:left 2.6s linear;z-index:10;cursor:pointer;display:none}
#cu .hd{position:absolute;bottom:0;left:30px;width:160px;height:160px;border-radius:50%;background:#c58a5a;border:6px solid #3a2210;text-align:center;font-size:90px;line-height:150px}
#cu.sel .hd{box-shadow:0 0 0 14px var(--em)}
#bub{position:absolute;bottom:170px;left:-30px;width:300px;background:#fff;border:6px solid #3a2210;border-radius:30px;padding:14px;font-size:28px;text-align:center;font-weight:700}
#hint{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:36px;color:var(--w1);font-weight:700;z-index:15}
#mn{position:absolute;top:18px;right:30px;z-index:20}
#pop{position:absolute;inset:0;background:rgba(30,16,6,.7);display:none;align-items:center;justify-content:center;z-index:99}
#pop.on{display:flex}
