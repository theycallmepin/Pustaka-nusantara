html,body{margin:0;height:100%;overflow:hidden;background:#2b1a0e;font-family:Georgia,'Times New Roman',serif;touch-action:manipulation}

.scr{position:absolute;inset:0;display:none}.scr.on{display:block}
.btn{min-width:240px;min-height:100px;padding:0 40px;font:700 44px Georgia,serif;color:var(--cr);background:linear-gradient(var(--w2),var(--w1));

.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #2a180a}
.btn.sm{min-width:150px;min-height:76px;font-size:32px}

#rack{position:absolute;left:260px;right:260px;bottom:70px;height:430px;background:linear-gradient(var(--w2),var(--w1));border:10px solid #3a2210;border-radius:14px;
display:flex;align-items:flex-end;justify-content:center;gap:34px;padding:0 30px 28px}

.bk i{display:block;font-size:24px;font-weight:400;margin-top:20px;background:rgba(0,0,0,.3);border-radius:20px;padding:4px}
.bk.hl{animation:bn .7s infinite alternate}
.bk{background-image:radial-gradient(circle at 50% 80%,transparent 0 26px,rgba(255,255,255,.35) 27px 30px,transparent 31px 40px,rgba(255,255,255,.2) 41px 43px,transparent 44px),linear-gradient(rgba(255,255,255,.14),rgba(0,0,0,.14))}
.bk:after{content:"";position:absolute;top:-6px;right:26px;width:22px;height:46px;background:#c0392b;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}@keyframes bn{to{transform:translateY(-18px)}}
#cu{position:absolute;bottom:500px;left:-300px;width:220px;height:260px;transition:left 2.6s linear;z-index:3;cursor:pointer;display:none}

#mn{position:absolute;top:18px;right:30px}
#pop{position:absolute;inset:0;background:rgba(30,16,6,.7);display:none;align-items:center;justify-content:center;z-index:9}

.pf{padding:6px 28px 6px 10px}.pf img{width:58px;height:58px;border-radius:50%;vertical-align:middle;margin-right:10px;background:#fff8e6;object-fit:cover}
#me{position:absolute;left:95px;top:165px;width:140px;height:140px;border-radius:50%;object-fit:cover;background:#fff8e6;border:5px solid #f3e6c8;display:none}
.pg{display:flex;justify-content:center;gap:50px;margin-bottom:24px}.pol{position:relative;width:340px;background:#fff;padding:16px 16px 10px;border-radius:6px;box-shadow:0 8px 0 rgba(0,0,0,.2);text-align:center;font-size:36px;transform:rotate(-2deg)}
.pol:nth-child(2){transform:rotate(1.5deg)}.pol:nth-child(3){transform:rotate(-1deg)}.ph{height:210px;display:flex;align-items:center;justify-content:center;font-size:110px;border-radius:4px}

#bo{position:absolute;left:560px;top:200px;width:800px;height:480px}

const B=[
{t:'Malin Kundang',g:'Legenda',c:'#b5483a',s:['Malin Kundang adalah anak nelayan miskin di pesisir Sumatra Barat. Ia merantau naik kapal dagang dan bekerja keras hingga menjadi saudagar kaya dengan istri yang cantik.','Saat pulang, ia malu mengakui ibunya yang renta. Sang ibu terluka dan berdoa. Badai datang, kapal Malin hancur, dan ia berubah menjadi batu. Cerita ini mengajarkan bakti kepada orang tua.']},
{t:'Timun Mas',g:'Dongeng',c:'#4a8c5c',s:['Mbok Sirni, seorang janda, diberi anak bernama Timun Mas oleh raksasa dengan janji akan diserahkan saat dewasa. Ketika waktunya tiba, Mbok Sirni menyuruh Timun Mas kabur sambil membawa bungkusan sakti.','Timun Mas melempar biji timun, jarum, garam, dan terasi. Semuanya berubah menjadi hutan, duri, lautan, dan lumpur mendidih yang menenggelamkan sang raksasa. Timun Mas selamat.']},
{t:'Bawang Merah Bawang Putih',g:'Dongeng',c:'#c9983a',s:['Bawang Putih hidup bersama ibu tiri dan Bawang Merah yang selalu memperlakukannya dengan kasar. Suatu hari baju ibu tiri hanyut di sungai, dan Bawang Putih disuruh mencarinya.','Ia bertemu nenek baik hati dan diberi labu berisi harta. Bawang Merah yang serakah mengambil labu besar, tetapi isinya ular dan binatang berbahaya. Kebaikan hati selalu berbuah manis.']},
{t:'Sangkuriang',g:'Legenda',c:'#5b6fb0',s:['Sangkuriang tumbuh tanpa tahu bahwa wanita cantik yang ia cintai, Dayang Sumbi, adalah ibunya sendiri. Ketika Dayang Sumbi tahu, ia mengajukan syarat mustahil: sebuah perahu dan danau dalam semalam.','Sangkuriang hampir berhasil dengan bantuan makhluk gaib. Dayang Sumbi menggelar kain tenun hingga fajar palsu terbit. Perahu yang ditendang Sangkuriang menjadi Gunung Tangkuban Parahu.']},
{t:'Gajah Mada',g:'Sejarah',c:'#8a4f9e',s:['Gajah Mada adalah mahapatih Kerajaan Majapahit pada abad ke-14. Ia terkenal dengan Sumpah Palapa, yaitu janji tidak akan menikmati palapa sebelum Nusantara bersatu.','Di bawah Raja Hayam Wuruk, Majapahit mencapai puncak kejayaan dan wilayahnya meliputi banyak pulau. Kisahnya menjadi simbol tekad persatuan bangsa.']},
{t:'Sumpah Pemuda',g:'Sejarah',c:'#2f8a9a',s:['Pada 28 Oktober 1928, pemuda dari berbagai daerah berkumpul dalam Kongres Pemuda II di Batavia. Mereka datang dengan bahasa, suku, dan adat yang berbeda-beda.','Mereka mengikrarkan satu tanah air, satu bangsa, dan satu bahasa persatuan: Indonesia. Ikrar ini menjadi tonggak penting menuju kemerdekaan.']},
{t:'Proklamator dari Blitar',g:'Sejarah',c:'#a33a3a',k:'Blitar',s:['Ir. Soekarno, presiden pertama Indonesia, menghabiskan masa kecilnya di Blitar, Jawa Timur. Di sana ia tumbuh dekat dengan rakyat kecil dan mulai memimpikan Indonesia merdeka.','Setelah wafat, Bung Karno dimakamkan di Blitar. Hingga kini makamnya ramai diziarahi orang dari berbagai penjuru negeri.']},
{t:'Roro Jonggrang',g:'Legenda',c:'#d0702a',k:'Yogyakarta',s:['Bandung Bondowoso mencintai Roro Jonggrang, putri Prambanan yang cantik. Roro Jonggrang mengajukan syarat: seribu candi harus berdiri dalam satu malam.','Dengan bantuan makhluk halus, hampir seribu candi selesai. Roro Jonggrang membangunkan para gadis menumbuk padi agar fajar tampak datang. Bondowoso murka dan mengutuknya menjadi arca, candi yang ke-seribu.']},
{t:'Putri Mandalika',g:'Legenda',c:'#1f8f8a',k:'Lombok',s:['Putri Mandalika adalah putri raja yang cantik di Lombok. Banyak pangeran memperebutkannya hingga muncul ancaman perang antar kerajaan.','Demi menjaga perdamaian, ia terjun ke laut di pantai selatan dan menjelma menjadi cacing laut warna-warni bernama nyale. Setiap tahun masyarakat Lombok merayakannya dalam tradisi Bau Nyale.']}];

 return `<svg viewBox="0 0 160 260" width="160" height="260">${bk}<ellipse cx="80" cy="252" rx="50" ry="8" fill="rgba(0,0,0,.22)"/><rect x="58" y="170" width="18" height="76" rx="6" fill="${pt}"/><rect x="84" y="170" width="18" height="76" rx="6" fill="${pt}"/><ellipse cx="66" cy="248" rx="14" ry="6" fill="#2a1a10"/><ellipse cx="94" cy="248" rx="14" ry="6" fill="#2a1a10"/><rect x="30" y="100" width="18" height="66" rx="9" fill="${sh}"/><rect x="112" y="100" width="18" height="66" rx="9" fill="${sh}"/><circle cx="39" cy="170" r="9" fill="${s}"/><circle cx="121" cy="170" r="9" fill="${s}"/><rect x="44" y="90" width="72" height="92" rx="24" fill="${sh}"/><g fill="rgba(255,255,255,.3)"><path d="M62 110l6 8-6 8-6-8zM94 106l6 8-6 8-6-8zM78 140l6 8-6 8-6-8zM58 158l6 8-6 8-6-8zM100 156l6 8-6 8-6-8z"/></g><rect x="72" y="80" width="16" height="18" fill="${s}"/><circle cx="80" cy="58" r="30" fill="${s}"/><circle cx="68" cy="60" r="3.5" fill="#2a1a10"/><circle cx="92" cy="60" r="3.5" fill="#2a1a10"/><path d="M70 74q10 9 20 0" stroke="#7a3a2a" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="60" cy="70" r="5" fill="rgba(220,90,90,.3)"/><circle cx="100" cy="70" r="5" fill="rgba(220,90,90,.3)"/>${fr}</svg>`}
const T=(f,m)=>{const r=run;return setTimeout(()=>{if(r==run)f()},m)};
const sv=()=>$('sv').textContent='✅'+ok+' · '+served+'/5';
let S={uang:0,hari:1,read:[],sold:[],up:0,done:[],items:[],st:{},av:-1,nm:''};
try{Object.assign(S,JSON.parse(localStorage.getItem('pustaka')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('pustaka',JSON.stringify(S))}catch(e){}};
const rp=n=>n.toLocaleString('id-ID');
function hud(){document.querySelectorAll('.um').forEach(e=>e.textContent=rp(S.uang));document.querySelectorAll('.hr').forEach(e=>e.textContent=S.hari);
 if(S.av>=0){document.querySelectorAll('#hud').forEach(h=>{let c=h.querySelector('.pf');if(!c){h.insertAdjacentHTML('afterbegin','<span class="chip pf"></span>');c=h.querySelector('.pf')}c.innerHTML='<img src="'+AVS[S.av]+'">';c.append(S.nm)});const m=$('me');if(m){m.src=AVS[S.av];m.style.display='block'}}}
function fit(){st.style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'}
addEventListener('resize',fit);fit();
function go(n){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==n));hud()}
let cb=null;
function pop(t,ps,btn,f){$('pt').textContent=t;$('pb').innerHTML=ps.map(p=>'<p>'+p+'</p>').join('');$('pc').textContent=btn||'Tutup';cb=f||null;$('pop').classList.add('on')}
$('pc').onclick=()=>{$('pop').classList.remove('on');if(cb){const f=cb;cb=null;f()}};
let shelf=[],cur=null,served=0,tm=null;
function startDay(){
 run++;clearTimeout(tm);$('shop').style.background='linear-gradient('+K[city].bg+' 0 55%,#e8d3a0 55%)';cur=null;ok=0;$('cu').style.display='none';$('hint').textContent='📍 '+K[city].n+' · Stamp '+(S.st[K[city].n]||0)+'/'+K[city].goal+' · Tap pelanggan, lalu tap buku.';
 shelf=B.filter(b=>!b.k||S.done.includes(b.k)).sort(()=>Math.random()-.5).slice(0,3+Math.floor(Math.random()*3));served=0;sv();
 const r=$('rack');r.innerHTML='';
 shelf.forEach(b=>{const d=document.createElement('div');d.className='bk';d.style.backgroundColor=b.c;d.innerHTML=b.t+'<i>'+b.g+'</i>';d.onclick=()=>tapBook(b,d);r.appendChild(d)});
 tm=T(nextCust,800);
}
function nextCust(){
 const el=$('cu'),want=shelf[Math.floor(Math.random()*shelf.length)].g;
 el.style.transition='none';el.style.left='-300px';el.style.display='block';el.classList.remove('sel');
 el.querySelector('.hd').innerHTML=av();
 $('bub').textContent='Cari buku '+want+'!';
 cur={want,tries:0,ready:false,sel:false};
 void el.offsetWidth;el.style.transition='left 2.6s linear';el.style.left='820px';
 T(()=>{if(cur)cur.ready=true},2600);
}
$('cu').onclick=()=>{if(!cur||!cur.ready)return;cur.sel=!cur.sel;$('cu').classList.toggle('sel',cur.sel);
 document.querySelectorAll('.bk').forEach(b=>b.classList.toggle('hl',cur.sel))};
function leave(){const c=$('cu');cur=null;c.classList.remove('sel');document.querySelectorAll('.bk').forEach(b=>b.classList.remove('hl'));
 c.style.transition='left 2s linear';c.style.left='2000px';served++;sv();save();hud();
 tm=T(()=>served>=5?endDay():nextCust(),2000)}
function tapBook(b){
 if(cur&&cur.sel&&cur.ready){
  if(b.g==cur.want){const p=15000+S.up*5000;S.uang+=p;if(!S.sold.includes(b.t))S.sold.push(b.t);
   $('bub').textContent='Makasih, '+S.nm+'! +Rp '+rp(p);cur.ready=false;ok++;stamp();hud();save();T(leave,1200)}
  else{cur.tries++;$('bub').textContent='Hmm, bukan '+cur.want+'...';
   if(cur.tries>=2){cur.ready=false;$('bub').textContent='Aku cari di toko lain.';T(leave,1200)}}
 }else{
  if(!S.read.includes(b.t)){S.read.push(b.t);save()}
  pop(b.t,b.s);
 }
}
function endDay(){
 const k=K[city],b=B.find(x=>x.k==k.n);S.hari++;save();
 if(pend){pend=null;pop('Stamp '+k.n+' penuh! 🎉',['Hadiah: buku baru <b>'+b.t+'</b> dan oleh-oleh <b>'+k.item+'</b>.',(city<2?'Kota berikutnya terbuka. ':'')+'Ini hadiah, bukan ujian. Main santai saja.'],'Ke Peta',peta)}
 else pop('Hari selesai',['Pelanggan puas hari ini: '+ok+'/5. Stamp '+k.n+': '+(S.st[k.n]||0)+'/'+k.goal+'.','Tidak ada kalah menang, main santai saja.'],'Ke Peta',peta)
 $('cu').style.display='none';
}
function kol(){
 $('kl').innerHTML='<div class="pg">'+K.map(k=>{const n=S.st[k.n]||0;return '<div class="pol '+(n?'':'dim')+'"><div class="ph" style="background:'+k.bg+'">'+k.e+'</div><b>'+k.n+'</b><span class="bd">'+n+'/'+k.goal+'</span>'+(S.done.includes(k.n)?'<span class="ck">✓</span>':'')+'</div>'}).join('')+'</div>'+
 '<div class="row"><span>📖 Buku dibaca</span><span>'+S.read.length+' / '+B.length+'</span></div><div class="row"><span>💰 Buku terjual</span><span>'+S.sold.length+' / '+B.length+'</span></div><div class="row"><span>🎁 Oleh-oleh</span><span>'+(S.items.join(', ')||'-')+'</span></div>';
 const c=60000*(S.up+1);$('up').textContent='Upgrade harga Rp '+rp(c);go('kol')}
$('up').onclick=()=>{const c=60000*(S.up+1);if(S.uang>=c){S.uang-=c;S.up++;save();kol()}else pop('Uang belum cukup',['Butuh Rp '+rp(c)+' untuk upgrade. Layani lebih banyak pelanggan dulu!'])};
function peta(){
 $('pl').innerHTML=K.map((k,i)=>{const o=i==0||S.done.includes(K[i-1].n),d=S.done.includes(k.n);
 return '<button class="btn city" data-i="'+i+'" '+(o?'':'disabled')+'><span>'+k.e+'</span>'+k.n+'<small>'+(d?'✅ Selesai':o?'Stamp '+(S.st[k.n]||0)+'/'+k.goal:'🔒 Terkunci')+'</small></button>'}).join('');
 $('pl').querySelectorAll('button').forEach(b=>b.onclick=()=>{city=+b.dataset.i;go('shop');startDay()});go('peta')}
const PR=['Di sebuah kota kecil di Blitar, berdiri gerobak buku tua milik kakekmu. Dulu, anak-anak berebut duduk di sekitarnya setiap sore untuk mendengar dongeng dan cerita rakyat.','Kakek kini sudah terlalu tua untuk berkeliling. Di laci gerobak, kamu menemukan sepucuk surat: “Cerita rakyat adalah rumah bagi ingatan kita. Bawalah gerobak ini keliling Nusantara, dan pertemukan setiap cerita dengan pembacanya.”','Dari Blitar, kamu mendorong gerobak itu keluar. Yogyakarta, Lombok, dan kota-kota lain sudah menunggu. Setiap kota punya cerita dan teman baru, tanpa perlu terburu-buru.'];
let pi=0,sa=0;
function prol(i){pi=i;$('pp').textContent=PR[i];$('dots').textContent=PR.map((_,j)=>j==i?'●':'○').join(' ');$('pn').textContent=i<2?'Lanjut':'Pilih Avatar';go('pro')}
$('pn').onclick=()=>pi<2?prol(pi+1):ava();
function ava(){sa=S.av>=0?S.av:0;$('nm').value=S.nm;$('ag').innerHTML=AVS.map((a,i)=>'<div class="at'+(i==sa?' on':'')+'" data-i="'+i+'"><img src="'+a+'"></div>').join('');
 $('ag').querySelectorAll('.at').forEach(d=>d.onclick=()=>{sa=+d.dataset.i;$('ag').querySelectorAll('.at').forEach(x=>x.classList.toggle('on',x==d))});go('ava')}
$('go').onclick=()=>{S.av=sa;S.nm=$('nm').value.trim()||'Sahabat Buku';save();hud();peta()};
$('bp').onclick=ava;$('bm').onclick=()=>S.nm?peta():prol(0);$('pb2').onclick=()=>go('menu');
$('bk').onclick=kol;$('kb').onclick=()=>go('menu');$('mn').onclick=()=>{run++;clearTimeout(tm);cur=null;go('menu')};
hud();
</script></body></html>
