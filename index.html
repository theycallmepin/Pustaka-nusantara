<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pustaka Nusantara - Cozy Bookshop</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--wood:#8B5A2B;--wood-dark:#5D3A1A;--cream:#FFF8E8;--paper:#FEF3D7;--accent:#FF9F45;--green:#4CAF6B;--pink:#FF8FA3}
*{box-sizing:border-box}
body{margin:0;font-family:'Fredoka',sans-serif;background:#D9B99B;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--wood-dark);color:#FFE4B5;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:700;position:sticky;top:0;z-index:10;box-shadow:0 4px 0 rgba(0,0,0,0.2)}
.pill{background:var(--cream);color:var(--wood-dark);padding:5px 12px;border-radius:20px;border:3px solid var(--wood);font-size:13px}
.scene{position:relative;height:38vh;min-height:300px;background:linear-gradient(180deg,#FFE4B5 0%,#E8C9A0 40%,#D9B99B 100%);overflow:hidden;border-bottom:6px solid var(--wood-dark);display:flex;align-items:end;justify-content:center}
.scene-deco{position:absolute;inset:0;padding:12px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-content:start;opacity:0.9}
.shelf-mini{background:var(--wood);border:2px solid var(--wood-dark);border-radius:6px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px}
.shop-overlay{position:relative;z-index:2;display:flex;align-items:end;justify-content:center;padding:16px;width:100%}
.counter{background:var(--cream);border:4px solid var(--wood-dark);border-radius:16px 16px 0 0;padding:14px;min-width:280px;max-width:90%;box-shadow:0 -8px 20px rgba(0,0,0,0.2);text-align:center}
.counter::before{content:'Pustaka Nusantara • Blitar';position:absolute;top:-26px;left:50%;transform:translateX(-50%);background:var(--wood-dark);color:#FFE4B5;padding:4px 12px;border-radius:20px;font-size:11px}
.customer-bubble{background:white;border:3px solid var(--wood-dark);border-radius:18px 18px 4px 18px;padding:10px 14px;font-family:'Patrick Hand',cursive;font-size:18px;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:10px;min-width:130px;box-shadow:0 4px 0 var(--wood-dark)}
.emoji-char{font-size:42px}
.name-tag{background:var(--wood);color:white;padding:2px 10px;border-radius:10px;font-size:12px;border:2px solid var(--wood-dark)}
.main{flex:1;background:var(--cream);padding:16px}
.hint{font-family:'Patrick Hand';text-align:center;font-size:16px;color:var(--wood-dark);margin:10px 0 14px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:420px;margin:0 auto}
.book-card{background:white;border:3px solid var(--wood-dark);border-radius:12px;padding:8px;min-height:105px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;box-shadow:0 4px 0 var(--wood-dark)}
.book-card:active{transform:translateY(4px);box-shadow:0 0 0 var(--wood-dark)}
.book-title{font-weight:700;font-size:12px;color:var(--wood-dark)}
.book-genre{font-size:10px;padding:3px 6px;border-radius:6px;background:var(--paper);border:2px solid var(--wood);display:inline-block;margin-top:6px}
.actions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap;max-width:420px;margin:0 auto}
.btn{border:3px solid var(--wood-dark);border-radius:14px;padding:10px 14px;font-family:'Fredoka';font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 0 var(--wood-dark)}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn-orange{background:var(--accent);color:var(--wood-dark)}
.btn-green{background:var(--green);color:white}
.btn-pink{background:var(--pink);color:var(--wood-dark)}
.start-screen{position:fixed;inset:0;background:radial-gradient(ellipse at center,#FFF8E8 0%,#E8C9A0 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:20;text-align:center}
.logo{font-size:38px;font-weight:800;color:var(--wood-dark);line-height:0.9;text-shadow:3px 3px 0 #FFD6A0}
.sub{font-family:'Patrick Hand';font-size:18px;color:var(--wood);margin:10px 0 20px}
.tip-box{background:white;border:3px dashed var(--wood);border-radius:12px;padding:10px 14px;font-size:12px;max-width:300px;margin-bottom:16px}
</style>
</head>
<body>
<div class="topbar"><span>Hari <b id="day">1</b>/7</span><span>Rp <b id="money">50</b>k</span><button class="pill">📚 Koleksi</button></div>
<div id="startScreen" class="start-screen"><div style="font-size:80px">📚🏡</div><div class="logo">Pustaka<br>Nusantara</div><div class="sub">Cozy tiny bookshop di Blitar</div><div class="tip-box">✨ V4 Fix Blank - 100% works di iPad!</div><button class="btn btn-orange" style="font-size:18px;padding:14px 28px" onclick="startDay()">BUKA TOKO HARI 1</button></div>
<div class="scene">
<div class="scene-deco"><div class="shelf-mini">📕📗📘</div><div class="shelf-mini">📙📓</div><div class="shelf-mini">🪴</div><div class="shelf-mini">📚📚</div><div class="shelf-mini">🪟☀️</div><div class="shelf-mini">📗📕</div><div class="shelf-mini">📘📙</div><div class="shelf-mini">🌿</div><div class="shelf-mini">📚📓📕</div><div class="shelf-mini">🪴</div><div class="shelf-mini">📗📘</div><div class="shelf-mini">🏡</div></div>
<div class="shop-overlay"><div class="counter" id="counter" style="display:none"><div id="bubble" class="customer-bubble" style="display:none">Mau Sejarah</div><div class="emoji-char" id="char">🧑</div><br><span class="name-tag" id="custName">Bu Ani</span></div></div>
</div>
