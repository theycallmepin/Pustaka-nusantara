<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pustaka Nusantara</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#E7D8B9;height:100dvh;display:flex;flex-direction:column;color:#4A2F1E;font-family:Georgia,serif}
.top{padding:12px 16px;display:flex;gap:8px;flex-shrink:0}.pill{background:#4A2F1E;color:#E7D8B9;padding:5px 14px;border-radius:20px;font:700 11px sans-serif}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.judul{font-size:42px;font-weight:900;line-height:.95}
.btns{margin-top:18px;display:flex;gap:10px}.btn{background:#5C3A24;color:#E7D8B9;border:2px solid #3D2412;border-bottom:3px solid #3D2412;padding:12px 26px;border-radius:8px;font:700 13px sans-serif;cursor:pointer}
.tulis{margin-top:26px;font:700 11px sans-serif;color:#5C3A24;animation:nafas 3s ease-in-out infinite}
@keyframes nafas{0%,100%{opacity:0}50%{opacity:1}}
.credit{text-align:center;padding:8px;font:600 9.5px sans-serif;color:#8B7355}
#shop,#col{display:none;flex:1;flex-direction:column;overflow:auto;background:#FFF8EC}
.shelf{background:#F3E4C0;border-bottom:4px solid #4A2F1E;padding:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.bk{background:#fff;border:2px solid #4A2F1E;border-radius:6px;height:36px;display:flex;align-items:center;justify-content:center;font:700 8px sans-serif}
.main{flex:1;padding:12px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;max-width:800px;margin:0 auto}
.card{background:#fff;border:2px solid #4A2F1E;border-radius:8px;padding:10px;cursor:pointer;box-shadow:0 3px 0 #4A2F1E}
.ab{border:2px solid #4A2F1E;border-radius:8px;padding:7px 12px;font:700 11px sans-serif;background:#E7D8B9;cursor:pointer}
</style></head><body>
<div class="top"><div class="pill">Rp <span id="rp">0</span>k</div><div class="pill">Hari <span id="hr">1</span>/7</div><div id="back" style="display:none;margin-left:auto"><button class="ab" onclick="balikHome()">← Home</button></div></div>

<div class="mid" id="home">
<div class="judul">Pustaka<br>Nusantara</div>
<div class="btns">
<button class="btn" onclick="mulaiGame()">Mulai</button>
<button class="btn" style="background:#8B6A4A" onclick="bukaKoleksi()">Koleksi</button>
</div>
<div class="tulis">Toko buku mungil bernuansa kayu perpustakaan Indonesia</div>
</div>

<div id="shop"><div class="shelf" id="shelf"></div><div style="text-align:center;margin:-10px auto 8px;background:#fff;border:2px solid #4A2F1E;border-radius:12px;padding:8px 14px"><div id="bub">Halo!</div><div style="font:700 10px sans-serif"><span id="cn">Bu Ani</span> cari <span id="cw">Sejarah</span></div></div><div class="main"><p id="hint" style="text-align:center;font:700 11px sans-serif">Klik buku yang sesuai!</p><div class="grid" id="grid"></div><div style="display:flex;gap:8px;justify-content:center;margin-top:14px"><button class="ab" style="background:#FFC96A" onclick="gantiPelanggan()">Ganti</button><button class="ab" style="background:#7BC67E;color:#fff" onclick="restockToko()">Restock -10k</button><button class="ab" style="background:#FF8FA3;color:#fff" onclick="tutupToko()">Tutup</button></div></div></div>

<div id="col"><div class="main"><h3 style="text-align:center">Koleksi</h3><div id="clist" style="display:grid;gap:8px;max-width:600px;margin:0 auto"></div></div></div>

<div class="credit">by Fitri Qur'an</div>

<script>
let D=1,M=0,C=null;
const B=[{t:"Lutung Kasarung",g:"Legenda"},{t:"Timun Mas",g:"Dongeng"},{t:"Malin Kundang",g:"Legenda"},{t:"Bawang Merah Putih",g:"Dongeng"},{t:"Roro Jonggrang",g:"Sejarah"}];
const P=[{n:"Bu Ani",w:"Sejarah"},{n:"Dek Sari",w:"Dongeng"},{n:"Mas Budi",w:"Legenda"}];
let S=[...B].sort(()=>.5-Math.random()).slice(0,5);

function renderToko(){document.getElementById('shelf').innerHTML=S.map(b=>`<div class=bk>${b.t.split(' ')[0]}</div>`).join('');document.getElementById('grid').innerHTML=S.map((b,i)=>`<div class=card onclick="jualBuku(${i})"><b>${b.t}</b><br><small>${b.g}</small></div>`).join('')}
function gantiPelanggan(){C=P[Math.floor(Math.random()*P.length)];document.getElementById('cn').textContent=C.n;document.getElementById('cw').textContent=C.w;document.getElementById('bub').textContent=`Mau ${C.w} dong!`}
function jualBuku(i){if(S[i].g===C.w){M+=15;document.getElementById('rp').textContent=M;S.splice(i,1);S.push(B[Math.floor(Math.random()*B.length)]);renderToko();gantiPelanggan()}else{alert(`Salah! Dia mau ${C.w}`)}}

function mulaiGame(){
  document.getElementById('home').style.display='none';
  document.getElementById('col').style.display='none';
  document.getElementById('shop').style.display='flex';
  document.getElementById('back').style.display='block';
  renderToko();gantiPelanggan();
}
function bukaKoleksi(){
  document.getElementById('home').style.display='none';
  document.getElementById('shop').style.display='none';
  document.getElementById('col').style.display='flex';
  document.getElementById('back').style.display='block';
  document.getElementById('clist').innerHTML=B.map(b=>`<div style="background:#fff;border:2px solid #4A2F1E;border-radius:8px;padding:10px"><b>${b.t}</b> - ${b.g}</div>`).join('');
}
function balikHome(){
  document.getElementById('shop').style.display='none';
  document.getElementById('col').style.display='none';
  document.getElementById('home').style.display='flex';
  document.getElementById('back').style.display='none';
}
function restockToko(){if(M>=10){M-=10;document.getElementById('rp').textContent=M;S=[...B].sort(()=>.5-Math.random()).slice(0,5);renderToko()}}
function tutupToko(){D++;if(D>7){alert(`Minggu selesai! Omzet Rp ${M}k`);D=1;M=0}document.getElementById('hr').textContent=D;document.getElementById('rp').textContent=M;renderToko();gantiPelanggan()}
</script></body></html>
