<style>

display:flex;align-items:flex-end;justify-content:center;gap:26px;padding:0 24px 20px}
#rack:before{content:"";position:absolute;left:0;right:0;bottom:0;height:28px;background:#3a2210}
.bk{position:relative;width:140px;height:210px;border:6px solid rgba(0,0,0,.45);border-radius:10px 14px 14px 10px;color:#fff;
font:700 17px Georgia,serif;padding:26px 6px 14px;text-align:center;box-shadow:inset 18px 0 0 rgba(0,0,0,.22),6px 6px 0 rgba(0,0,0,.3);cursor:pointer;z-index:1}
.bk i{display:block;font-size:15px;font-weight:400;margin-top:10px;background:rgba(0,0,0,.3);border-radius:20px;padding:2px}
.bk.hl{animation:bn .7s infinite alternate}
.bk{background-image:radial-gradient(circle at 50% 80%,transparent 0 18px,rgba(255,255,255,.35) 19px 21px,transparent 22px 28px,rgba(255,255,255,.2) 29px 30px,transparent 31px),linear-gradient(rgba(255,255,255,.14),rgba(0,0,0,.14))}
.bk:after{content:"";position:absolute;top:-6px;right:18px;width:16px;height:32px;background:#c0392b;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}@keyframes bn{to{transform:translateY(-18px)}}

.pf{padding:6px 28px 6px 10px}.pf img{width:58px;height:58px;border-radius:50%;vertical-align:middle;margin-right:10px;background:#fff8e6;object-fit:cover}

.pg{display:flex;justify-content:center;gap:50px;margin-bottom:24px}.pol{position:relative;width:340px;background:#fff;padding:16px 16px 10px;border-radius:6px;box-shadow:0 8px 0 rgba(0,0,0,.2);text-align:center;font-size:36px;transform:rotate(-2deg)}
.pol:nth-child(2){transform:rotate(1.5deg)}.pol:nth-child(3){transform:rotate(-1deg)}.ph{height:210px;display:flex;align-items:center;justify-content:center;font-size:110px;border-radius:4px}
.bd{position:absolute;top:6px;right:6px;background:rgba(220,230,240,.95);padding:2px 12px;font-size:26px;border-radius:6px}.ck{position:absolute;top:-14px;right:-6px;color:#2a9d4a;font-size:70px;font-weight:700}
#cb{position:absolute;left:210px;bottom:380px;width:1500px}#vn{position:absolute;left:500px;bottom:335px;width:920px}
.pl{position:absolute;bottom:330px;left:40px;width:280px;z-index:2}#p2{left:auto;right:40px;transform:scaleX(-1)}
.cb2{position:absolute;left:210px;bottom:380px;width:1500px}.vn2{position:absolute;left:500px;bottom:200px;width:920px}.mb{position:absolute;left:60px;bottom:50px;width:380px}.vn3{position:absolute;right:50px;bottom:40px;width:520px}
.ci{width:54px;height:54px;vertical-align:middle;margin-right:6px}
#sp{position:absolute;left:260px;right:260px;top:90px;background:#fff;border:8px solid #3a2210;border-radius:60px;padding:40px 60px;font-size:46px;line-height:1.5;box-shadow:0 10px 0 rgba(0,0,0,.2)}
#sp:after{content:"";position:absolute;left:50%;bottom:-50px;margin-left:-30px;border:30px solid transparent;border-top:44px solid #3a2210;border-bottom:0}#sp p{margin:0;min-height:230px}#dots{text-align:center;font-size:38px;color:var(--w1)}
#ld{position:absolute;inset:0;background:#f3e6c8;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20}#ld.on{display:flex}#lm{height:520px;animation:bn .6s infinite alternate}#lt{font-size:56px;font-weight:700;color:var(--w1);margin-top:40px}
#cu .hd img{height:400px;width:auto;max-width:340px;object-fit:contain}
@keyframes wk{50%{transform:translateY(-14px) rotate(1.5deg)}}#cu.walk .hd{animation:wk .5s infinite}
.amb{position:absolute;left:0;bottom:392px;animation:drv 30s linear infinite}#a1{height:150px}#a2{height:130px;animation-duration:22s;animation-delay:-9s}
@keyframes drv{from{transform:translateX(2000px)}to{transform:translateX(-500px)}}
.sk{position:absolute;left:0;bottom:0;width:1920px;opacity:.6}.gl{position:absolute;left:600px;top:85px;width:130px;animation:sp 14s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}


</style></head><body>

<script>
const $=i=>document.getElementById(i),st=$('st');
const B=[
{t:'Warta Nusantara',g:'Berita',c:'#5f7488',s:['Koran harian ini merangkum kabar dari berbagai pulau: panen raya, festival budaya, sampai harga cabai di pasar.','Halaman daerahnya jadi favorit para perantau yang rindu kampung sambil menikmati kopi pagi.']},
{t:'Kabar dari Pasar',g:'Berita',c:'#a8643c',s:['Kumpulan liputan ringan dari pasar tradisional di Jawa dan Sumatra, lengkap dengan wajah-wajah penjualnya.','Dari penjual jamu hingga tukang sayur, setiap orang punya cerita yang layak dimuat.']},
{t:'Misteri Kereta Malam',g:'Kriminal',c:'#3a3f55',s:['Seorang detektif muda naik kereta malam dari Jakarta ke Yogyakarta. Di gerbong ketiga, sebuah koper tua tiba-tiba hilang.','Satu per satu penumpang punya alasan untuk berbohong. Sebelum fajar tiba, sang detektif harus menemukan pelakunya.']},
{t:'Kasus Kunci Perpustakaan',g:'Kriminal',c:'#7a2f3a',s:['Kunci ruang koleksi langka sebuah perpustakaan kota hilang tepat sebelum pameran naskah kuno dibuka.','Petunjuknya hanya secarik catatan dan aroma melati. Pustakawan tua itu mulai dicurigai.']},
{t:'Keliling Jawa Naik Kereta',g:'Travel',c:'#2f7f8f',s:['Panduan perjalanan santai menyusuri Jawa dari stasiun ke stasiun, lengkap dengan warung dan kopi yang layak dicoba.','Jendela kereta menyuguhkan sawah, gunung, dan kota kecil yang jarang masuk peta wisata.']},
{t:'Pantai Sunyi Lombok',g:'Travel',c:'#d08a3a',s:['Catatan perjalanan menyusuri pantai-pantai tenang di Lombok yang jauh dari keramaian.','Pasir putih, laut jernih, dan senja yang pelan cocok untuk siapa saja yang ingin istirahat dari hiruk pikuk.']},
{t:'Malin Kundang',g:'Anak',c:'#b5483a',s:['Malin Kundang adalah anak nelayan miskin di pesisir Sumatra Barat. Ia merantau naik kapal dagang dan bekerja keras hingga menjadi saudagar kaya dengan istri yang cantik.','Saat pulang, ia malu mengakui ibunya yang renta. Sang ibu terluka dan berdoa. Badai datang, kapal Malin hancur, dan ia berubah menjadi batu. Cerita ini mengajarkan bakti kepada orang tua.']},
{t:'Timun Mas',g:'Anak',c:'#4a8c5c',s:['Mbok Sirni, seorang janda, diberi anak bernama Timun Mas oleh raksasa dengan janji akan diserahkan saat dewasa. Ketika waktunya tiba, Mbok Sirni menyuruh Timun Mas kabur sambil membawa bungkusan sakti.','Timun Mas melempar biji timun, jarum, garam, dan terasi. Semuanya berubah menjadi hutan, duri, lautan, dan lumpur mendidih yang menenggelamkan sang raksasa. Timun Mas selamat.']},
{t:'Bawang Merah Bawang Putih',g:'Anak',c:'#c9983a',s:['Bawang Putih hidup bersama ibu tiri dan Bawang Merah yang selalu memperlakukannya dengan kasar. Suatu hari baju ibu tiri hanyut di sungai, dan Bawang Putih disuruh mencarinya.','Ia bertemu nenek baik hati dan diberi labu berisi harta. Bawang Merah yang serakah mengambil labu besar, tetapi isinya ular dan binatang berbahaya. Kebaikan hati selalu berbuah manis.']},
{t:'Sangkuriang',g:'Fiksi',c:'#5b6fb0',s:['Sangkuriang tumbuh tanpa tahu bahwa wanita cantik yang ia cintai, Dayang Sumbi, adalah ibunya sendiri. Ketika Dayang Sumbi tahu, ia mengajukan syarat mustahil: sebuah perahu dan danau dalam semalam.','Sangkuriang hampir berhasil dengan bantuan makhluk gaib. Dayang Sumbi menggelar kain tenun hingga fajar palsu terbit. Perahu yang ditendang Sangkuriang menjadi Gunung Tangkuban Parahu.']},
{t:'Gajah Mada',g:'Belajar',c:'#8a4f9e',s:['Gajah Mada adalah mahapatih Kerajaan Majapahit pada abad ke-14. Ia terkenal dengan Sumpah Palapa, yaitu janji tidak akan menikmati palapa sebelum Nusantara bersatu.','Di bawah Raja Hayam Wuruk, Majapahit mencapai puncak kejayaan dan wilayahnya meliputi banyak pulau. Kisahnya menjadi simbol tekad persatuan bangsa.']},
{t:'Sumpah Pemuda',g:'Belajar',c:'#2f8a9a',s:['Pada 28 Oktober 1928, pemuda dari berbagai daerah berkumpul dalam Kongres Pemuda II di Batavia. Mereka datang dengan bahasa, suku, dan adat yang berbeda-beda.','Mereka mengikrarkan satu tanah air, satu bangsa, dan satu bahasa persatuan: Indonesia. Ikrar ini menjadi tonggak penting menuju kemerdekaan.']},
{t:'Proklamator dari Blitar',g:'Belajar',c:'#a33a3a',k:'Blitar',s:['Ir. Soekarno, presiden pertama Indonesia, menghabiskan masa kecilnya di Blitar, Jawa Timur. Di sana ia tumbuh dekat dengan rakyat kecil dan mulai memimpikan Indonesia merdeka.','Setelah wafat, Bung Karno dimakamkan di Blitar. Hingga kini makamnya ramai diziarahi orang dari berbagai penjuru negeri.']},
{t:'Roro Jonggrang',g:'Fiksi',c:'#d0702a',k:'Yogyakarta',s:['Bandung Bondowoso mencintai Roro Jonggrang, putri Prambanan yang cantik. Roro Jonggrang mengajukan syarat: seribu candi harus berdiri dalam satu malam.','Dengan bantuan makhluk halus, hampir seribu candi selesai. Roro Jonggrang membangunkan para gadis menumbuk padi agar fajar tampak datang. Bondowoso murka dan mengutuknya menjadi arca, candi yang ke-seribu.']},
{t:'Putri Mandalika',g:'Fiksi',c:'#1f8f8a',k:'Lombok',s:['Putri Mandalika adalah putri raja yang cantik di Lombok. Banyak pangeran memperebutkannya hingga muncul ancaman perang antar kerajaan.','Demi menjaga perdamaian, ia terjun ke laut di pantai selatan dan menjelma menjadi cacing laut warna-warni bernama nyale. Setiap tahun masyarakat Lombok merayakannya dalam tradisi Bau Nyale.']}];

function stamp(){const k=K[city];if(S.done.includes(k.n))return;const n=S.st[k.n]=(S.st[k.n]||0)+1;$('hint').textContent=$('hint').textContent.replace(/Stamp \d+/,'Stamp '+n);if(n>=k.goal){S.done.push(k.n);S.items.push(k.item);pend=k}}
const T=(f,m)=>{const r=run;return setTimeout(()=>{if(r==run)f()},m)};
const sv=()=>$('sv').textContent='✅'+ok+' · '+served+'/5';
let S={uang:0,hari:1,read:[],sold:[],up:0,done:[],items:[],st:{},av:-1,nm:''};
try{Object.assign(S,JSON.parse(localStorage.getItem('pustaka')||'{}'))}catch(e){}

const rp=n=>n.toLocaleString('id-ID');
function hud(){document.querySelectorAll('.um').forEach(e=>e.textContent=rp(S.uang));document.querySelectorAll('.hr').forEach(e=>e.textContent=S.hari);
 if(S.av>=0){document.querySelectorAll('#hud').forEach(h=>{let c=h.querySelector('.pf');if(!c){h.insertAdjacentHTML('afterbegin','<span class="chip pf"></span>');c=h.querySelector('.pf')}c.innerHTML='<img src="'+AVS[S.av]+'">';c.append(S.nm)});const m=$('me');if(m){m.src=AVS[S.av];m.style.display='block'}}}

addEventListener('resize',fit);fit();

let cb=null;
function pop(t,ps,btn,f){$('pt').textContent=t;$('pb').innerHTML=ps.map(p=>'<p>'+p+'</p>').join('');$('pc').textContent=btn||'Tutup';cb=f||null;$('pop').classList.add('on')}
$('pc').onclick=()=>{$('pop').classList.remove('on');if(cb){const f=cb;cb=null;f()}};
let shelf=[],cur=null,served=0,tm=null;
function startDay(){
 run++;clearTimeout(tm);$('shop').style.background='linear-gradient('+K[city].bg+' 0 62%,#e8d3a0 62%)';$('cb').style.filter='hue-rotate('+[0,30,150][city]+'deg)';cur=null;ok=0;$('cu').style.display='none';$('hint').textContent='📍 '+K[city].n+' · Stamp '+(S.st[K[city].n]||0)+'/'+K[city].goal+' · Tap pelanggan, lalu tap buku.';
 const pool=B.filter(b=>!b.k||S.done.includes(b.k)).sort(()=>Math.random()-.5),pk=[];G6.forEach(g=>{const b=pool.find(x=>x.g==g);if(b)pk.push(b)});shelf=pk.concat(pool.filter(x=>!pk.includes(x)).slice(0,Math.floor(Math.random()*2))).sort(()=>Math.random()-.5);served=0;sv();
 const r=$('rack');r.innerHTML='';
 shelf.forEach(b=>{const d=document.createElement('div');d.className='bk';d.style.backgroundColor=b.c;d.innerHTML=b.t+'<i>'+b.g+'</i>';d.onclick=()=>tapBook(b,d);r.appendChild(d)});

function nextCust(){
 const el=$('cu'),want=shelf[Math.floor(Math.random()*shelf.length)].g;
 el.style.transition='none';el.style.left='-420px';el.style.display='block';el.classList.remove('sel');el.classList.add('walk');
 el.querySelector('.hd').innerHTML='<img src="'+CS[Math.floor(Math.random()*CS.length)]+'">'
 $('bub').textContent='Cari buku '+want+'!';
 cur={want,tries:0,ready:false,sel:false};
 void el.offsetWidth;el.style.transition='left 2.6s linear';el.style.left='790px';
 T(()=>{if(cur)cur.ready=true;el.classList.remove('walk')},2600);
}
$('cu').onclick=()=>{if(!cur||!cur.ready)return;cur.sel=!cur.sel;$('cu').classList.toggle('sel',cur.sel);

function leave(){const c=$('cu');cur=null;c.classList.remove('sel');document.querySelectorAll('.bk').forEach(b=>b.classList.remove('hl'));
 c.classList.add('walk');c.style.transition='left 2s linear';c.style.left='2000px';served++;sv();save();hud();
 tm=T(()=>served>=5?endDay():nextCust(),2000)}
function tapBook(b){
 if(cur&&cur.sel&&cur.ready){
  if(b.g==cur.want){const p=15000+S.up*5000;S.uang+=p;if(!S.sold.includes(b.t))S.sold.push(b.t);
   $('bub').textContent='Makasih, '+S.nm+'! +Rp '+rp(p);cur.ready=false;ok++;stamp();hud();save();T(leave,1200)}
  else{cur.tries++;$('bub').textContent='Hmm, bukan '+cur.want+'...';
   if(cur.tries>=2){cur.ready=false;$('bub').textContent='Aku cari di toko lain.';T(leave,1200)}}
 }else{
  if(!S.read.includes(b.t)){S.read.push(b.t);save()}
  pop(b.t,b.s);
 }
}
function endDay(){

 else pop('Hari selesai',['Pelanggan puas hari ini: '+ok+'/5. Stamp '+k.n+': '+(S.st[k.n]||0)+'/'+k.goal+'.','Tidak ada kalah menang, main santai saja.'],'Ke Peta',peta)
